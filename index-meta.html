<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Compare a trafficking sheet with a Meta Ads export and download a discrepancy report.">
  <title>Meta QAer</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
  <script src="script.js" defer></script>
  <style>
    :root {
      color-scheme: dark;
      --green: #00d26a;
      --blue: #1877f2;
      --white: #f7fbff;
      --muted: #9fb0c4;
      --panel: rgba(2, 8, 19, 0.54);
      --line: rgba(255, 255, 255, 0.15);
      --danger-bg: rgba(255, 91, 111, 0.12);
      --danger-line: rgba(255, 124, 139, 0.35);
      --danger: #ff9ca8;
      --success: #62e9a6;
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      background: linear-gradient(135deg, #020208 0%, #08101a 40%, #0d3882 100%);
      background-attachment: fixed;
      color: var(--white);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    button, input { font: inherit; }

    button:focus-visible,
    label:focus-within,
    summary:focus-visible {
      outline: 3px solid rgba(130, 200, 255, 0.7);
      outline-offset: 4px;
    }

    .app-shell {
      width: min(1080px, calc(100% - 40px));
      min-height: 100vh;
      margin: 0 auto;
      padding: 34px 0 48px;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 52px;
    }

    .brand-logo {
      display: block;
      width: 56px;
      height: 38px;
      object-fit: contain;
    }

    .brand-title {
      margin: 0;
      font-size: clamp(1.35rem, 3vw, 1.8rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: 0;
    }

    main { position: relative; }

    .view {
      width: 100%;
      opacity: 1;
      transform: translateY(0);
      transition: opacity 320ms ease, transform 320ms ease;
    }

    .view[hidden] { display: none; }

    .view.is-leaving {
      opacity: 0;
      transform: translateY(-12px);
    }

    .view.is-entering {
      opacity: 0;
      transform: translateY(14px);
    }

    .main-view {
      display: grid;
      place-items: center;
      min-height: calc(100vh - 134px);
      padding: 48px 0 88px;
    }

    .upload-stage {
      width: min(780px, 100%);
      text-align: center;
    }

    .upload-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 48px minmax(0, 1fr);
      align-items: start;
      gap: 18px;
    }

    .upload-slot { min-width: 0; }

    .file-input {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      clip-path: inset(50%);
      white-space: nowrap;
    }

    .upload-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 74px;
      padding: 16px 20px;
      border: 1.5px solid currentColor;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.08);
      font-size: 1rem;
      font-weight: 720;
      cursor: pointer;
      transition: background 180ms ease, box-shadow 180ms ease, transform 180ms ease;
    }

    .upload-button:hover {
      background: rgba(255, 255, 255, 0.06);
      box-shadow: 0 0 30px color-mix(in srgb, currentColor 17%, transparent);
      transform: translateY(-2px);
    }

    .upload-button.traffic { color: var(--green); }
    .upload-button.meta { color: #6aa9ff; }

    .upload-button span { color: var(--white); }

    .file-name {
      display: block;
      min-height: 36px;
      margin: 11px 4px 0;
      overflow: hidden;
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.4;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-name.has-file { color: #dce9f7; }

    .versus {
      display: grid;
      place-items: center;
      min-height: 74px;
      color: rgba(255, 255, 255, 0.55);
      font-size: 0.84rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .analyze-wrap {
      display: inline-block;
      margin-top: 38px;
      padding: 1.5px;
      border-radius: 8px;
      background: linear-gradient(90deg, var(--green), var(--blue));
      box-shadow: 0 12px 36px rgba(0, 75, 180, 0.2);
    }

    .analyze-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-width: 190px;
      min-height: 52px;
      padding: 12px 28px;
      border: 0;
      border-radius: 7px;
      background: #07101a;
      color: var(--white);
      font-weight: 780;
      cursor: pointer;
      transition: background 180ms ease, transform 180ms ease;
    }

    .analyze-button:hover:not(:disabled) {
      background: #0a1724;
      transform: translateY(-1px);
    }

    .analyze-button:disabled { cursor: not-allowed; opacity: 0.55; }

    .progress-region {
      width: min(460px, 90%);
      margin: 30px auto 0;
      opacity: 1;
      transition: opacity 200ms ease;
    }

    .progress-region[hidden] { display: none; }

    .progress-label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin-bottom: 11px;
      color: #d6e3f0;
      font-size: 0.88rem;
    }

    .spinner {
      width: 15px;
      height: 15px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 720ms linear infinite;
    }

    .progress-track {
      height: 7px;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.12);
    }

    .progress-fill {
      width: 34%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--green), var(--blue));
      animation: progress 1.25s ease-in-out infinite;
    }

    .results-view { padding: 54px 0 36px; }

    .results-header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
    }

    .results-title {
      margin: 0;
      font-size: clamp(2rem, 6vw, 4.2rem);
      font-weight: 850;
      line-height: 0.92;
      letter-spacing: 0;
    }

    .results-subtitle {
      max-width: 480px;
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 0.93rem;
      line-height: 1.5;
    }

    .summary-stats {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 20px;
      margin: 0;
    }

    .stat { min-width: 72px; text-align: right; }

    .stat-value {
      display: block;
      font-size: 1.5rem;
      font-weight: 800;
      line-height: 1;
    }

    .stat-label {
      display: block;
      margin-top: 7px;
      color: var(--muted);
      font-size: 0.72rem;
      text-transform: uppercase;
    }

    .notice {
      margin: 22px 0 0;
      padding: 13px 15px;
      border: 1px solid rgba(255, 199, 78, 0.3);
      border-radius: 6px;
      background: rgba(255, 183, 41, 0.09);
      color: #ffe0a2;
      font-size: 0.84rem;
      line-height: 1.5;
    }

    .notice[hidden] { display: none; }

    .results-list {
      display: grid;
      gap: 14px;
      margin-top: 28px;
    }

    .campaign-group,
    .adset-group,
    .ad-group {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      backdrop-filter: blur(10px);
    }

    .adset-group,
    .ad-group { background: rgba(255, 255, 255, 0.025); }

    details > summary {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 50px;
      padding: 13px 16px;
      cursor: pointer;
      list-style: none;
    }

    details > summary::-webkit-details-marker { display: none; }

    details > summary::before {
      width: 8px;
      height: 8px;
      flex: 0 0 8px;
      border-right: 1.5px solid var(--muted);
      border-bottom: 1.5px solid var(--muted);
      content: "";
      transform: rotate(-45deg);
      transition: transform 160ms ease;
    }

    details[open] > summary::before { transform: rotate(45deg); }

    .summary-name {
      min-width: 0;
      overflow-wrap: anywhere;
      font-weight: 700;
    }

    .summary-count {
      flex: 0 0 auto;
      margin-left: auto;
      color: var(--danger);
      font-size: 0.78rem;
      font-weight: 700;
    }

    .group-body {
      display: grid;
      gap: 10px;
      padding: 0 14px 14px 38px;
    }

    .adset-group .group-body { padding-left: 36px; }

    .ad-group { border-color: var(--danger-line); }

    .mismatch-list {
      display: grid;
      gap: 9px;
      margin: 0;
      padding: 0 14px 15px 38px;
      list-style: none;
    }

    .mismatch-item {
      display: grid;
      grid-template-columns: minmax(120px, 0.7fr) minmax(0, 1fr) 22px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      padding: 12px;
      border-left: 2px solid #f27684;
      background: var(--danger-bg);
      font-size: 0.82rem;
    }

    .mismatch-field { color: #ffd6dc; font-weight: 750; }

    .value-block { min-width: 0; }

    .value-source {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 0.66rem;
      font-weight: 750;
      text-transform: uppercase;
    }

    .value-text {
      display: block;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .value-arrow { color: rgba(255, 255, 255, 0.45); }

    .empty-state {
      padding: 72px 20px;
      border-top: 1px solid var(--line);
      text-align: center;
    }

    .empty-state svg { color: var(--success); }

    .empty-state h2 { margin: 18px 0 7px; font-size: 1.35rem; }
    .empty-state p { margin: 0; color: var(--muted); }

    .actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-top: 36px;
    }

    .action-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 46px;
      padding: 10px 24px;
      border: 1px solid rgba(255, 255, 255, 0.88);
      border-radius: 7px;
      background: transparent;
      color: var(--white);
      font-weight: 750;
      cursor: pointer;
      transition: background 180ms ease, opacity 180ms ease, transform 180ms ease;
    }

    .action-button:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.09);
      transform: translateY(-1px);
    }

    .action-button:disabled { cursor: not-allowed; opacity: 0.35; }

    .restart-button {
      min-height: 38px;
      padding: 8px 16px;
      border-color: rgba(255, 255, 255, 0.4);
      opacity: 0.72;
      font-size: 0.84rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @keyframes progress {
      0% { transform: translateX(-120%); }
      60%, 100% { transform: translateX(300%); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 1ms !important;
      }
    }

    @media (max-width: 720px) {
      .app-shell { width: min(100% - 28px, 1080px); padding-top: 24px; }
      .main-view { padding-top: 38px; }
      .upload-grid { grid-template-columns: 1fr; gap: 8px; }
      .versus { min-height: 30px; }
      .file-name { min-height: 22px; }
      .results-view { padding-top: 40px; }
      .results-header { align-items: flex-start; flex-direction: column; }
      .summary-stats { justify-content: flex-start; }
      .stat { text-align: left; }
      .group-body, .adset-group .group-body { padding-left: 14px; }
      .mismatch-list { padding-left: 14px; }
      .mismatch-item { grid-template-columns: 1fr; gap: 12px; }
      .value-arrow { display: none; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="brand" aria-label="Meta QAer">
      <img
        class="brand-logo"
        src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 40'%3E%3Cpath d='M5 28C10 10 17 4 24 14l8 12 8-12c7-10 14-4 19 14M5 28c4 10 11 10 19-2l8-12 8 12c8 12 15 12 19 2' fill='none' stroke='%231877F2' stroke-width='5.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
        alt="Meta"
        width="56"
        height="38"
      >
      <h1 class="brand-title">Meta QAer</h1>
    </header>

    <main>
      <section id="mainView" class="view main-view" aria-labelledby="mainHeading">
        <div class="upload-stage">
          <h2 id="mainHeading" hidden>Upload spreadsheets for comparison</h2>
          <div class="upload-grid">
            <div class="upload-slot">
              <input class="file-input" id="trafficFile" type="file" accept=".xlsx,.xls,.xlsm,.csv" aria-describedby="trafficFileName">
              <label class="upload-button traffic" for="trafficFile">
                <i data-lucide="sheet" aria-hidden="true"></i>
                <span>Trafficking Sheet</span>
              </label>
              <span class="file-name" id="trafficFileName">No file selected</span>
            </div>

            <div class="versus" aria-hidden="true">vs</div>

            <div class="upload-slot">
              <input class="file-input" id="metaFile" type="file" accept=".xlsx,.xls,.xlsm,.csv" aria-describedby="metaFileName">
              <label class="upload-button meta" for="metaFile">
                <i data-lucide="file-spreadsheet" aria-hidden="true"></i>
                <span>Exported Meta Sheet</span>
              </label>
              <span class="file-name" id="metaFileName">No file selected</span>
            </div>
          </div>

          <div class="analyze-wrap">
            <button id="analyzeButton" class="analyze-button" type="button">
              <i data-lucide="scan-search" aria-hidden="true"></i>
              Analyze
            </button>
          </div>

          <div id="progressRegion" class="progress-region" role="status" aria-live="polite" hidden>
            <div class="progress-label"><span class="spinner" aria-hidden="true"></span>Analyzing Data...</div>
            <div class="progress-track" aria-hidden="true"><div class="progress-fill"></div></div>
          </div>
        </div>
      </section>

      <section id="resultsView" class="view results-view" aria-labelledby="resultsHeading" hidden>
        <div class="results-header">
          <div>
            <h2 id="resultsHeading" class="results-title">RESULTS</h2>
            <p id="resultsSubtitle" class="results-subtitle"></p>
          </div>
          <div class="summary-stats" aria-label="Analysis summary">
            <div class="stat"><span id="adsChecked" class="stat-value">0</span><span class="stat-label">Ads checked</span></div>
            <div class="stat"><span id="adsFlagged" class="stat-value">0</span><span class="stat-label">Ads flagged</span></div>
            <div class="stat"><span id="issueCount" class="stat-value">0</span><span class="stat-label">Issues</span></div>
          </div>
        </div>

        <p id="analysisNotice" class="notice" hidden></p>
        <div id="resultsList" class="results-list"></div>

        <div class="actions">
          <button id="downloadButton" class="action-button" type="button">
            <i data-lucide="download" aria-hidden="true"></i>
            Download
          </button>
          <button id="restartButton" class="action-button restart-button" type="button">
            <i data-lucide="rotate-ccw" aria-hidden="true"></i>
            Restart
          </button>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
